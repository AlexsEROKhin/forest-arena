name: Publish Forest Arena to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Builds/WebGL/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Check WebGL build
        shell: bash
        run: test -f Builds/WebGL/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebGL site
        uses: actions/upload-pages-artifact@v4
        with:
          path: Builds/WebGL

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
