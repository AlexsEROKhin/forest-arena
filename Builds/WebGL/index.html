<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07140d" />
    <title>Forest Arena</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07140d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(68, 112, 50, 0.28), transparent 48%),
          linear-gradient(180deg, #0c2117, #040806 75%);
      }

      #game-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #1F1F20;
        outline: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 16px;
        padding: 24px;
        background: rgba(3, 9, 6, 0.88);
        text-align: center;
        transition: opacity 220ms ease;
      }

      #loading.hidden {
        pointer-events: none;
        opacity: 0;
      }

      .title {
        color: #f1e4b7;
        font-size: clamp(24px, 4vw, 48px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 3px 0 #183320;
      }

      .track {
        width: min(440px, 76vw);
        height: 18px;
        padding: 3px;
        border: 2px solid #d5bd72;
        border-radius: 999px;
        background: #14271a;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }

      #progress {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #69ad35, #cbd840);
        transition: width 120ms linear;
      }

      #status {
        min-height: 24px;
        color: #c9d7c7;
        font-size: 15px;
      }

      #fullscreen {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: none;
        border: 1px solid rgba(241, 228, 183, 0.55);
        border-radius: 10px;
        padding: 9px 12px;
        color: #f1e4b7;
        background: rgba(7, 20, 13, 0.78);
        cursor: pointer;
      }

      #fullscreen:hover {
        background: rgba(27, 58, 36, 0.92);
      }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
    </main>

    <section id="loading" aria-live="polite">
      <div class="title">Forest Arena</div>
      <div class="track"><div id="progress"></div></div>
      <div id="status">Загрузка игры…</div>
    </section>

    <button id="fullscreen" type="button">На весь экран</button>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress");
      const status = document.querySelector("#status");
      const fullscreen = document.querySelector("#fullscreen");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Forest Arena",
        productVersion: "1.0",
      }, (value) => {
        const percent = Math.round(value * 100);
        progress.style.width = `${percent}%`;
        status.textContent = `Загрузка игры: ${percent}%`;
      }).then((unityInstance) => {
        loading.classList.add("hidden");
        fullscreen.style.display = "block";
        fullscreen.addEventListener("click", () => unityInstance.SetFullscreen(1));
        canvas.focus();
      }).catch((message) => {
        status.textContent = "Не удалось загрузить игру. Обнови страницу.";
        console.error(message);
      });
    </script>
  </body>
</html>
